<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #08080a;
        color: #f4efe6;
        font-family: 'Inter Tight', sans-serif;
        position: relative;
      }
      .glow {
        position: absolute;
        width: 820px; height: 680px;
        left: -260px; top: -300px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,106,61,.3), transparent 70%);
        filter: blur(8px);
      }
      .glow2 {
        position: absolute;
        width: 700px; height: 700px;
        right: -220px; bottom: -380px;
        background: radial-gradient(50% 50% at 50% 50%, rgba(255,106,61,.16), transparent 70%);
        filter: blur(8px);
      }
      .grid {
        position: absolute; inset: 0;
        background-image: linear-gradient(to right, rgba(244,239,230,.055) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(244,239,230,.055) 1px, transparent 1px);
        background-size: 80px 80px;
        -webkit-mask-image: radial-gradient(75% 95% at 28% 38%, #000, transparent 82%);
      }
      .left {
        position: absolute; left: 68px; top: 56px; width: 600px; z-index: 3;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand img { width: 36px; height: 36px; display: block; }
      .brand span { font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
      .eyebrow {
        margin-top: 52px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
        color: #b4ada3; display: flex; align-items: center; gap: 10px;
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: #ff6a3d; }
      h1 {
        margin-top: 20px;
        font-size: 72px; line-height: .94; letter-spacing: -.05em; font-weight: 500;
      }
      h1 em {
        font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
        letter-spacing: -.02em; color: #ff9168;
      }
      p {
        margin-top: 24px; max-width: 520px;
        font-size: 17px; line-height: 1.55; color: #b6afa5;
      }
      .foot {
        position: absolute; left: 68px; bottom: 48px;
        display: flex; align-items: center; gap: 16px; z-index: 3;
        font-family: 'IBM Plex Mono', monospace; font-size: 11px;
        letter-spacing: .1em; text-transform: uppercase; color: #8b847a;
        white-space: nowrap;
      }
      .foot b { color: #f4efe6; font-weight: 500; }
      .shot {
        position: absolute; right: 34px; top: 118px;
        width: 570px; border-radius: 14px; overflow: hidden;
        border: 1px solid rgba(244,239,230,.2);
        box-shadow: 0 50px 100px -20px rgba(0,0,0,.95), 0 0 80px -30px rgba(255,106,61,.5);
        transform: rotate(-2.2deg);
        z-index: 2;
      }
      .shot img { display: block; width: 100%; }
      .shot::after {
        content: '';
        position: absolute; inset: 0;
        background: linear-gradient(180deg, rgba(8,8,10,.06), transparent 30%, rgba(8,8,10,.18));
        pointer-events: none;
      }
      .tag {
        position: absolute; right: 52px; bottom: 52px; z-index: 3;
        display: flex; align-items: center; gap: 9px;
        padding: 10px 16px 10px 13px;
        border: 1px solid rgba(244,239,230,.16);
        border-radius: 999px;
        background: rgba(17,17,19,.85);
        -webkit-backdrop-filter: blur(8px);
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
        color: #cfc8bd;
      }
      .tag i { width: 6px; height: 6px; border-radius: 50%; background: #ff6a3d; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="grid"></div>

    <div class="left">
      <div class="brand">
        <img src="../assets/hestia-icon.svg" alt="" />
        <span>hestia</span>
      </div>

      <div class="eyebrow"><span class="dot"></span> BIM open source no navegador</div>

      <h1>A obra inteira,<br /><em>em um só modelo.</em></h1>

      <p>
        Paredes, aberturas, pisos, lajes, telhados e escadas no mesmo modelo. Planta, corte, 3D e prancha
        saem todos dele.
      </p>
    </div>

    <div class="shot">
      <img src="../assets/modelo-3d.png" alt="" />
    </div>

    <div class="tag"><i></i> Modelo 3D · ao vivo</div>

    <div class="foot">
      <b>hestiabim.com</b>
      <span>·</span>
      <span>Grátis e open source</span>
      <span>·</span>
      <span>IFC · DXF · PDF</span>
    </div>
  </body>
</html>
